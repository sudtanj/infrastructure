[package]
name = "rust-ci-runner"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[dependencies]
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
tiny_http = "0.12"
