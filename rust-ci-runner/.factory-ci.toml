# Pipeline of the runner itself, run by the selftest job own-pipelines and by a tick.
# Tests that need a container engine are #[ignore]d; the selftest pipeline job runs them with --include-ignored.
[steps.lint]
image = "rust:1.90"
commands = ["rustup component add clippy rustfmt", "cargo fmt --check", "cargo clippy --locked -- -D warnings"]
timeout = 1200

# A step container has --pids-limit 512. The tests of ship, job and github each start mock HTTP servers whose
# threads never exit, so one test process holds about 600 threads. Three processes stay under the limit.
[steps.test]
image = "rust:1.90"
commands = [
  "cargo test --locked -- --skip ship_tests:: --skip job_tests::",
  "cargo test --locked --lib ship_tests::",
  "cargo test --locked --lib job_tests::",
]
timeout = 1800
