name: factory-ci-selftest

# Exception to "only the release workflow compiles the runner" (feature 008, owner decision): pull requests
# return 403 here and both landings are direct pushes, so this workflow compiles and type-checks the
# runner, and builds the image without pushing it, before the code reaches main. It runs on pull requests
# and on pushes to every branch except main. It holds no secret: the step in the workflow job below fails
# when this file gains one, a deployment gate or a privileged trigger.
on:
  pull_request:
    paths:
      - "rust-ci-runner/**"
      - ".github/workflows/factory-ci*.yml"
      - ".github/factory-ci-repos.toml"
      - ".github/scripts/**"
  push:
    branches-ignore: [main]
    paths:
      - "rust-ci-runner/**"
      - ".github/workflows/factory-ci*.yml"
      - ".github/factory-ci-repos.toml"
      - ".github/scripts/**"

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: build the runner from source
        working-directory: rust-ci-runner
        run: cargo build --locked --release
      - name: run the fixture pipeline
        shell: bash
        run: |
          FACTORY_CI_SHA=$(git rev-parse HEAD) FACTORY_CI_EVENT=push FACTORY_CI_BRANCH=selftest \
            rust-ci-runner/target/release/rust-ci-runner run --dir rust-ci-runner/tests/fixtures/selftest | tee out.txt
          grep -q '^\[img\] selftest-ok' out.txt
          grep -q '^\[after\] one$' out.txt
          grep -q '^\[after\] two$' out.txt
      - name: no containers, networks or volumes are left
        shell: bash
        run: |
          test -z "$(docker ps -aq --filter label=factory-ci.run)"
          test -z "$(docker network ls -q --filter label=factory-ci.run)"
          test -z "$(docker volume ls -q --filter label=factory-ci.run)"
      # The image is built for both architectures and not pushed. The arm64 binary is a stand-in copy of
      # the amd64 one: the Dockerfile only copies it. A wrong bws hash or a broken stage fails here.
      - name: stage the image context
        run: |
          mkdir -p image/amd64 image/arm64
          cp rust-ci-runner/target/release/rust-ci-runner image/amd64/rust-ci-runner
          cp rust-ci-runner/target/release/rust-ci-runner image/arm64/rust-ci-runner
          cp rust-ci-runner/Dockerfile image/Dockerfile
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: build the image for amd64 and arm64, no push
        run: docker buildx build --platform linux/amd64,linux/arm64 image

  list:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: type-check the unit tests
        working-directory: rust-ci-runner
        run: cargo test --locked --lib --no-run
      # The integration tests, executor.rs included (this runner has docker): a broken one turns the run red.
      - name: integration tests
        working-directory: rust-ci-runner
        run: cargo test --locked --test '*'
      - name: format check and clippy
        working-directory: rust-ci-runner
        run: make lint
      - name: check the watch list
        working-directory: rust-ci-runner
        run: cargo run --locked -q -- plan --repos ../.github/factory-ci-repos.toml --check

  workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: lint the tick and release workflows
        run: .github/scripts/factory-ci-lint-workflow.sh .github/workflows/factory-ci-tick.yml .github/workflows/rust-ci-runner-release.yml
      # The patterns use [x] so this step does not match itself.
      - name: this workflow holds no secret, gate or privileged trigger
        run: |
          f=.github/workflows/factory-ci-selftest.yml
          if grep -En '[e]nvironment:|[i]d-token|[p]ull_request_target|[w]orkflow_run|[r]epository_dispatch|[s]ecrets:|[s]ecrets\[|toJSON\([s]ecrets' "$f"; then
            echo "factory-ci-selftest must not use these" >&2
            exit 1
          fi
          if grep -En '[s]ecrets\.[A-Z_]' "$f" | grep -v 'secrets\.GITHUB_TOKEN'; then
            echo "factory-ci-selftest may use no secret other than GITHUB_TOKEN" >&2
            exit 1
          fi

  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: shell tests of the secrets library and the wrappers
        run: .github/scripts/test-factory-ci-secrets.sh
      - name: shell tests of the hardening rules
        run: .github/scripts/test-factory-ci-hardening.sh
      - name: shell checks of the factory-monorepo-ci workflow
        run: .github/scripts/test-factory-monorepo-ci.sh
      - name: the lint catches a broken copy of each rule
        run: .github/scripts/factory-ci-lint-workflow.sh --self-test .github/workflows/factory-ci-tick.yml .github/workflows/rust-ci-runner-release.yml
