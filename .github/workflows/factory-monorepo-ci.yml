# Starts the CI job of rust-ci-runner by hand: one container from the pinned release image. The runner does the rest (watch list check, Bitwarden, Loki probe, fetch, docker refusal, pipeline) and prints only fixed lines; see rust-ci-runner/README.md.
# Owner exception of 2026-11-27: this workflow holds BWS_ACCESS_TOKEN (in the Environment factory-ci) and reaches Bitwarden through the image, so the constitution was amended to 1.1.0. It supersedes parts of specs/005-plain-actions-ci/, specs/006-runner-unit-tests/ and specs/007-runner-image/ (feature 008).
# Never switch this job to a self-hosted runner: the runner container holds the host docker socket and the access token, and only the ephemeral GitHub-hosted VM contains that.
name: factory-monorepo-ci

on:
  workflow_dispatch:
    inputs:
      repo:
        description: repository to run, owner/name; it must be in .github/factory-ci-repos.toml
        type: string
        default: sudtanj/factory-monorepo
      ref:
        description: branch to run; it must match the branches of its watch entry
        type: string
        default: main
      project:
        description: "project folder, or . for the repository root"
        type: string
        default: .

concurrency:
  group: factory-monorepo-ci-${{ inputs.repo }}-${{ inputs.ref }}-${{ inputs.project }}
  cancel-in-progress: false

permissions: {}

env:
  # Pinned by digest; bump this line after each release, by a reviewed commit.
  RUNNER_IMAGE: ghcr.io/sudtanj/rust-ci-runner:0.2.0@sha256:f35772a54a14dde7d312f03704b559f1165526022c2fc020c8cced31b570bd91

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: factory-ci
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: run the job
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          FACTORY_CI_BWS_SERVER_URL: ${{ vars.FACTORY_CI_BWS_SERVER_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ inputs.repo }}
          REF: ${{ inputs.ref }}
          PROJECT: ${{ inputs.project }}
        run: |
          set -eu
          DOCKER_CONFIG=$(mktemp -d); export DOCKER_CONFIG; trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          mkdir -p "$RUNNER_TEMP/ci"
          docker run -q --rm --init --name "factory-ci-runner-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --user "$(id -u):$(id -g)" --group-add "$(stat -c %g /var/run/docker.sock)" \
            --cap-drop ALL --security-opt no-new-privileges --read-only \
            --tmpfs /tmp:rw,size=64m -e HOME=/tmp \
            -e BWS_ACCESS_TOKEN -e GITHUB_RUN_ID -e FACTORY_CI_BWS_SERVER_URL \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/ci:$RUNNER_TEMP/ci" \
            -v "$GITHUB_WORKSPACE/.github/factory-ci-repos.toml:/etc/factory-ci/repos.toml:ro" \
            "$RUNNER_IMAGE" ci --repos /etc/factory-ci/repos.toml --repo "$REPO" --ref "$REF" --project "$PROJECT" --work "$RUNNER_TEMP/ci"
